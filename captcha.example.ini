[setting]
# 是否启用自动验证码识别
enable = true
# 视觉模型 API Key（默认 DeepSeek）
api_key = sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
# OpenAI 兼容接口地址
base_url = https://api.deepseek.com/v1
# 支持图片输入的模型
model = deepseek-flash
# 单次识别请求超时（秒）
timeout = 120
# 无头模式运行浏览器，调试时可改为 false 观察验证码
headless = true
# 一轮验证码最多识别几次（识别错会重新出题）
max_rounds = 2
