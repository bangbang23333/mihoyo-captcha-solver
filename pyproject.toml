[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mihoyo-captcha-solver"
version = "0.1.0"
description = "极验九宫格点选验证码识别（视觉模型 + Playwright），供米游社类签到项目调用"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.26.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]

[project.scripts]
mihoyo-captcha = "mihoyo_captcha.__main__:main"

[tool.setuptools.packages.find]
include = ["mihoyo_captcha*"]
